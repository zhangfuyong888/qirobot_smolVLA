# Self-contained real-robot Quest teleoperation server.
# This project publishes lowcmd/handscmd directly over ROS2 DDS; no qiling_s4 code is required.
#
# One-time setup:
#   bash hardware_teleop/scripts/build_ros_msgs.sh
#   edit hardware_teleop/config/ros_env.sh  (network interface, rarely)
#
# Before teleop or ros2 topic debugging:
#   source hardware_teleop/scripts/source_ros_env.sh
#
# Runtime requirements on the teleop machine:
#   - ROS2 Humble (/opt/ros/humble)
#   - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp and CYCLONEDDS_URI pointing at the robot LAN
#   - Robot SDK publishing lowstate on the configured topic (default: lowstate)
#
# Do not run another lowcmd publisher (e.g. moveit_mit_arm_bridge) concurrently.

teleop_config: configs/teleoperation/meta_quest3.yaml

hardware:
  control_rate_hz: 30.0
  # lowstate: subscribe to qi/LowState directly (default, no qiling bridge needed)
  # joint_states: fallback if an external bridge publishes sensor_msgs/JointState
  state_source: lowstate
  lowstate_topic: lowstate
  joint_states_topic: /joint_states
  lowcmd_topic: lowcmd
  hands_cmd_topic: /handscmd
  body_dof: 26
  arm_kp: 60.0
  arm_kd: 2.0
  reversed_joint_names:
    - left_wrist_roll_joint
    - left_wrist_yaw_joint
    - right_shoulder_yaw_joint
  max_joint_step_rad: 0.065
  require_initial_state: true
  initial_state_timeout_s: 15.0
  stale_command_hold: true
  # Stop arm motion if lowstate/joint_states has not updated for this long.
  max_state_age_s: 0.5

startup:
  move_to_home: true
  duration_s: 4.0
  max_joint_step_rad: 0.03
  position_tolerance_rad: 0.02
  check_lowcmd_publishers: true

gravity_compensation:
  enabled: true
  urdf_path: assets/my_robot/urdf/s4_40dof_merged.urdf
  scale: 0.6
  sign: 1.0
  tau_limit: 12.0
  ramp_time: 2.0
  gravity_vector: [0.0, 0.0, -9.81]
  source: current

ik:
  backend: rmpflow

hands:
  left_open_uint16: [255, 255, 255, 255, 255, 255]
  left_close_uint16: [60, 128, 200, 200, 150, 90]
  right_open_uint16: [255, 255, 255, 255, 255, 255]
  right_close_uint16: [60, 128, 200, 200, 150, 90]
  duration_ms: 200
  left_hand_id: 0
  right_hand_id: 1
  left_hand_array_index: 0
  right_hand_array_index: 1
  hands_mode: 1
  hands_mode_ctrl: 5
  hand_mode: 1

scene:
  robot_base_z: 0.98
  joint_stiffness: 600.0
  joint_damping: 60.0
  joint_effort_limit: 400.0
