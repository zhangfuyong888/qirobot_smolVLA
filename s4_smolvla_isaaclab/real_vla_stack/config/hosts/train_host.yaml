paths:
  raw_root: /home/zfy/real_vla_data
  lerobot_root: /home/zfy/lerobot_datasets
  output_root: /home/zfy/real_outputs
  model_root: /home/zfy/smolVLA/s4_smolvla_isaaclab/models
dataset:
  repo_id: s4_real_drawer_right_v1
training:
  profile: baseline
  device: cuda
  batch_size: 16
  num_workers: 16
  save_freq: 50000
  seed: 42
  profiles:
    smoke: 300
    overfit: 5000
    baseline: 200000
    full: 400000
model:
  policy: smolvla
  # Full LeRobot policy snapshot. Production training fails closed when this
  # directory is absent or does not contain the pretrained action expert.
  pretrained_policy: /home/zfy/smolVLA/s4_smolvla_isaaclab/models/lerobot/smolvla_base
  chunk_size: 50
  n_obs_steps: 1
  max_state_dim: 50
  max_action_dim: 32
  resize_imgs_with_padding: [512, 512]
  freeze_vision_encoder: true
  train_expert_only: true
  train_state_proj: true
  load_vlm_weights: true
  vlm_model_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  optimizer_lr: 1.0e-5
  optimizer_weight_decay: 0.0001
  optimizer_grad_clip_norm: 10.0
server:
  bind: 0.0.0.0
  port: 5555
  device: cuda
  image_transport: jpeg
  jpeg_quality: 90
  rtc:
    enabled: true
    execution_horizon: 10
    max_guidance_weight: 10.0
deployment:
  checkpoint: /home/zfy/real_outputs/right_drawer_open_close_v1_smolvla_base_ft_full/checkpoints/300000/pretrained_model
