network:
  policy_server: 192.168.110.87
  policy_port: 5555
  connect_timeout_ms: 1000
  request_timeout_ms: 500
rollout:
  mode: live
  control_hz: 30
  policy_hz: 20
  execute_horizon: 35
  # Request a fresh plan every ten 20 Hz policy steps (500 ms). The remaining
  # half of the 20-step window covers normal LAN/inference delay and one retry.
  replan_interval_steps: 10
  # Let both USB cameras settle auto exposure/white balance before the first
  # policy observation. The on-robot cameras stabilize within about 2 seconds.
  camera_warmup_s: 2.0
  start_from_home: true
  return_home_on_finish: true
  # Faults hold briefly and relinquish; an automatic fault-time trajectory can
  # create a second collision with the drawer or workspace.
  return_home_on_abort: false
  max_episode_s: 30
freshness:
  # Responses older than this are never accepted as a new plan.
  max_response_age_ms: 500
  # After this age, stop advancing the policy trajectory and hold the last
  # published absolute target while an immediate retry is in flight.
  max_motion_chunk_age_ms: 1800
  # Recovery deadline. Exceeding it aborts and relinquishes output.
  max_chunk_age_ms: 2400
  max_consecutive_timeouts: 2
  # One stochastic outlier is discarded. Three consecutive unsafe chunks abort.
  max_consecutive_policy_rejections: 2
  rtc_latency_window_size: 30
  rtc_latency_percentile: 95
safety:
  reject_non_finite: true
  max_policy_target_jump_rad: 0.20
  max_policy_tracking_error_rad: 0.25
  # Stop if the actuator does not follow the already step-limited command.
  max_command_tracking_error_rad: 0.18
  # Per-joint limits derived from 1.1x the drawer dataset P95 and capped by the
  # commissioned bridge's 0.032 rad/publish final guard at 30 Hz.
  max_rollout_joint_velocity_rad_s: [0.77, 0.50, 0.77, 0.91, 0.95, 0.70, 0.67]
  max_rollout_joint_acceleration_rad_s2: [7.70, 7.10, 9.05, 9.17, 12.55, 7.00, 6.98]
  # RTC is responsible for chunk continuity when enabled. Keep robot-side
  # interpolation only; hard safety checks remain active.
  chunk_blend_duration_ms: 0
gripper:
  open_threshold: 0.35
  grasp_threshold: 0.65
logging:
  # In shadow mode, keep two JPEGs and the state every ten policy requests
  # (about 2 Hz at the configured 20 Hz policy rate), plus every validated
  # eight-step execution chunk in events.jsonl.
  shadow_snapshot_every_n_requests: 10
