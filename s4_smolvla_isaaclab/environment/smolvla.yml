name: smolvla
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - ffmpeg
  - pytest
  - pip:
      - torch==2.7.0
      - torchvision==0.22.0
      - av==15.1.0
      - numpy==2.2.6
      - pyarrow==25.0.0
      - pandas==3.0.5
      - transformers==5.5.4
      - safetensors==0.8.0
      - datasets==5.0.0
      # LeRobot's training entry point requires Accelerate for both single-GPU
      # and distributed runs. Keep it in the reproducible environment rather
      # than installing it into a disposable container at runtime.
      - accelerate==1.14.0
      - num2words==0.5.14
      - pyyaml==6.0.2
      - msgpack==1.1.2
      - pyzmq==27.0.2
# Install the external LeRobot checkout in editable mode after creating this
# environment. See docs/REPRODUCTION.md.
