services:
  s4-smolvla:
    image: ${S4_IMAGE_INTERNAL:-s4-smolvla:full-v4}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    gpus: all
    ipc: host
    shm_size: 64g
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      ACCEPT_EULA: "Y"
      OMNI_KIT_ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      S4_KIT_OFFLINE: "1"
      # Informational only. docker/run.sh sets this after creating the actual
      # Docker GPU device request; it must not be used for GPU isolation.
      S4_GPUS: ${S4_GPUS_INTERNAL:-all}
      S4_DOCKER_SELECTED_GPU_COUNT: ${S4_SELECTED_GPU_COUNT_INTERNAL:-}
      XDG_RUNTIME_DIR: /workspace/runtime/xdg-runtime
      NVIDIA_DRIVER_CAPABILITIES: graphics,compute,utility
      VK_ICD_FILENAMES: /etc/vulkan/icd.d/nvidia_icd_headless.json
      S4_DATA_ROOT: /workspace/smolVLA/s4_smolvla_isaaclab/datasets
      S4_OUTPUT_ROOT: /workspace/smolVLA/s4_smolvla_isaaclab/outputs
      S4_ROLLOUT_CHECKPOINT: /workspace/smolVLA/s4_smolvla_isaaclab/outputs/train/smolvla_drawer_insert_close_v4_12phase_serial_acquire/checkpoints/350000/pretrained_model
      S4_CACHE_ROOT: /workspace/runtime/cache
    volumes:
      - ./runtime:/workspace/runtime
      # Docker initializes these named volumes from the datasets and outputs
      # baked into the image, then preserves all later collection/training data.
      - s4-datasets:/workspace/smolVLA/s4_smolvla_isaaclab/datasets
      - s4-outputs:/workspace/smolVLA/s4_smolvla_isaaclab/outputs
    working_dir: /workspace/smolVLA/s4_smolvla_isaaclab
    command: bash

volumes:
  s4-datasets:
  s4-outputs:
